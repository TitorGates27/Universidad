<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="bootstrap.min.css">
</head>
<body>
    <p class="display-2">Ejemplo de filas</p>

    <div class="container">
        <h5>Ejemplo de columnas simples</h5>
        <div class="row">
            <div class="col bg-primary">1</div>
            <div class="col bg-secondary"></div>
            <div class="col bg-danger"></div>
        </div>
        <h5>Ejemplo de columnas con medida</h5>
        <div class="row">
            <div class="col-4 bg-warning">4</div>
            <div class="col-8 bg-success">8</div>
        </div>
        <h5>Ejemplo columnas con punto de quiebre</h5>
        <div class="row">
            <div class="col-md-8 col-sm-4 bg-info">Quiebre</div>
            <div class="col-md-4 col-sm-8" style="background-color: pink;">Normal</div>
        </div>
    </div>
    
    <script src="bootstrap.min.js"></script>
</body>
</html>
